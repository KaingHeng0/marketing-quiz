", "explanation": "Incorrect. Product ethics is unrelated to social selling as a sales methodology."}], "correct": 1}], "9": [{"type": "standard", "question": "What is the fundamental difference between multichannel and omnichannel?", "scenario": null, "options": [{"text": "Omnichannel is for B2C; multichannel is for B2B", "explanation": "Incorrect. Both approaches apply across B2C and B2B contexts."}, {"text": "Multichannel means multiple independent channels; Omnichannel means seamless integration where customers move between channels without friction", "explanation": "Correct. A multichannel business has separate web, phone, and store systems that do not share data. Omnichannel means the experience is consistent and connected regardless of which channel is used."}, {"text": "Multichannel means online channels; omnichannel integrates online and offline", "explanation": "Incorrect. Both can include online and offline — the distinction is integration, not channel type."}, {"text": "Multichannel uses more channels than omnichannel", "explanation": "Incorrect. The difference is not the number of channels but the degree of integration between them."}], "correct": 1}, {"type": "standard", "question": "What is disintermediation in channel strategy?", "scenario": null, "options": [{"text": "Reducing channel partner discount rates", "explanation": "Incorrect. Channel pricing changes are commercial decisions, not disintermediation."}, {"text": "Removing intermediaries from the distribution chain — selling directly to end customers online", "explanation": "Correct. E-commerce enabled many manufacturers to bypass wholesalers, distributors, and retailers — selling direct-to-consumer."}, {"text": "Reducing the number of product SKUs per channel", "explanation": "Incorrect. SKU rationalisation is product management, not disintermediation."}, {"text": "Creating new digital intermediaries to reach customers more efficiently", "explanation": "Incorrect. Creating new intermediaries ecord containing ALL customer interactions across every channel — enabling personalisation, retention, and relationship management", "explanation": "Correct. Without SCV, different departments have different contradictory customer records. SCV enables consistent, personalised engagement across all touchpoints."}, {"text": "A policy of assigning each customer a single named contact person", "explanation": "Incorrect. A single point of contact is a service model — SCV is a data architecture concept."}, {"text": "Viewing each customer as an individual rather than part of a segment", "explanation": "Incorrect. While SCV enables individualisation, it is specifically a data integration concept."}, {"text": "A one-page dashboard showing a customer's purchase history", "explanation": "Incorrect. SCV is an architectural concept — a unified data record, not a report format."}], "correct": 0}, {"type": "standard", "question": "What does the Benefits Dependency Network require before claiming a CRM benefit?", "scenario": null, "options": [{"text": "Board-level approval of the CRM budget", "explanation": "Incorrect. Budget approval is necessary for implementation but is not a component of the BDN framework itself."}, {"text": "A pilot programme demonstrating the benefit at small scale", "explanation": "Incorrect. Piloting is good practice but not what the BDN framework specifically requires."}, {"text": "That the enabling technology AND the required business change have both been identified and planned", "explanation": "Correct. BDN links: IT Enablers to IS Capabilities to Business Changes to Business Benefits. You cannot claim a benefit without mapping both the technology and the organisational changes needed."}, {"text": "Evidence that competitors have already achieved the same benefit", "explanation": "Incorrect. Competitive benchmarking is irrelevant to the BDN framework's logic."}], "correct": 2}, {"type": "standard", "question": "What is RFM analysis and how is it used in sophistication."}], "correct": 2}, {"type": "scenario", "question": "A subscription software company finds daily login customers in their first 30 days have 91% 12-month retention, while those logging in fewer than 3 times in 30 days have only 34% retention. No onboarding programme exists. What should they do?", "scenario": "This data came from 12 months of customer behaviour analysis. The sales team knows the pattern but has been focused entirely on new acquisition. Currently new customers receive one welcome email and no further contact for 30 days.", "options": [{"text": "Design a proactive onboarding programme triggered at sign-up that drives daily usage in the critical first 30 days", "explanation": "Correct. The data shows early engagement is the strongest predictor of retention. Targeting the 30-day window directly addresses the 34% versus 91% retention gap."}, {"text": "Cancel subscriptions of customers who do not log in within the first 30 days", "explanation": "Incorrect. Gaming metrics this way destroys customer lifetime value — the goal is to convert low-engagement customers into high-engagement ones."}, {"text": "Focus marketing on acquiring customers who are naturally more engaged", "explanation": "Incorrect. You cannot know engagement level before acquisition — the actionable lever is post-acquisition onboarding."}, {"text": "Increase pricing to attract higher-quality customers who will be more committed", "explanation": "Incorrect. Price increase changes the acquisition pool but does not address the engagement-retention relationship already proven in the data."}], "correct": 0}, {"type": "scenario", "question": "A UK retailer invests 12 million pounds in CRM. After 18 months: only 40% of sales staff use it consistently, 35% of customer records have missing contact details, and no new customer communications have been enabled. What went wrong?", "scenario": "The IT director celebrates a successful on-time, on-budget technical implementation. The commercial director says they spent 12 million pounds and their customer marketing capability is no better than before.", "options": [{"text": "CRM is not suitable for retail businesses", "explanation": "Incorrect. Retail is one of the sectors with the longest and most successful history of CRM application."}, {"text": "12 million pounds was insufficient — CRM requires larger investment to succeed", "explanation": "Incorrect. Budget sufficiency is not the issue — the problems are organisational and process failures, not underfunding."}, {"text": "The implementation failed because CRM is 80% people, process and data — change management, data quality, and process redesign were all neglected", "explanation": "Correct. The book warns explicitly that CRM fails at a 50 to 70 percent rate because companies treat it as a technology project. 40% adoption, poor data quality, and no new capabilities all point to failures in change management and process."}, {"text": "The CRM software chosen was the wrong technology", "explanation": "Incorrect. Technology selection may be a factor but the symptoms point to implementation failure across non-technology dimensions."}], "correct": 2}, {"type": "standard", "question": "What is integration maturity in CRM?", "scenario": null, "options": [{"text": "Having CRM technically integrated with ERP and finance systems", "explanation": "Incorrect. Technical integration is part of the enabler — but integration maturity is about the organisational customer-centric structure."}, {"text": "Achieving ISO certification for CRM processes", "explanation": "Incorrect. Certification standards are compliance measures — not what the book means by integration maturity."}, {"text": "The number of software systems integrated with the CRM platform", "explanation": "Incorrect. Number of integrations is a technical metric — integration maturity is about organisational structure."}, {"text": "Organising the business around the customer — breaking down functional silos so marketing, sales, and service share data and work collaboratively around customer outcomes", "explanation": "Correct. Integration maturity requires not just technology integration but organisational redesign — shared data, shared goals, and cross-functional processes centred on the customer."}], "correct": 3}, {"type": "scenario", "question": "A luxury hotel has 500,000 loyalty members. Top 2,000 stay 15 or more nights per year generating 38% of revenue. Next 48,000 stay 3 to 7 nights generating 41%. The remaining 450,000 stay once and rarely return. What CRM strategy is needed?", "scenario": "Currently all 500,000 members receive identical loyalty emails, identical points rates, and identical service priority. The hotel's CLV analysis shows the top 2,000 members are worth 200 times more than the average member over their lifetime.", "options": [{"text": "Three-tier CRM strategy: ultra-premium service for the top 2,000; active nurture programme for the 48,000; targeted win-back for the 450,000 — with investment proportional to CLV", "explanation": "Correct. RFM analysis reveals three distinct groups requiring completely different CRM approaches. Investment must be proportional to CLV — the top tier deserves disproportionate investment."}, {"text": "Offer identical benefits to all 500,000 members to be fair and consistent", "explanation": "Incorrect. Equal treatment of dramatically unequal-value customers misallocates resources and fails to reward the most valuable appropriately."}, {"text": "Focus all resources on acquiring new loyalty members to grow the programme", "explanation": "Incorrect. Acquisition at the expense of retaining and deepening existing high-value relationships contradicts the book's core retention economics argument."}, {"text": "Cancel the loyalty programme — it is too complex to manage", "explanation": "Incorrect. The programme serves a clear purpose for the 50,000 active members — the issue is tier design, not programme existence."}], "correct": 0}]}};

<script>
const D = APP_DATA;

// ── STATE ──────────────────────────────────────────────────
const ls = { ch:null, section:'concepts', visited:new Set(), open:new Set() };
const qs = { ch:null, pool:[], queue:[], idx:0, score:0, answered:false, sel:null, mode:'all', chScores:{} };

// ── INIT ───────────────────────────────────────────────────
function init(){
  buildSidebar(); buildDots(); buildChGrid(); buildQuizGrid();
  renderWelcome();
}

// ── UTILS ──────────────────────────────────────────────────
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]; } return a; }

function fmtText(t){
  return t.replace(/([A-Z]{4,})/g, m => `<strong>${m}</strong>`);
}

// ── NAVIGATION ─────────────────────────────────────────────
function switchPage(id, btn){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-'+id).classList.add('active');
  document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
}

// ── SIDEBAR ────────────────────────────────────────────────
function buildSidebar(){
  const sb=document.getElementById('chSidebar');
  let h='<div class="sidebar-label">Chapters</div>';
  for(let ch=1;ch<=10;ch++){
    const active=ls.ch===ch, visited=ls.visited.has(ch);
    h+=`<button class="ch-item${active?' active':''}${visited?' visited':''}" onclick="loadCh(${ch})">
      <span class="ch-ico">${D.icons[ch]}</span>
      <span class="ch-lbl"><span class="ch-num-lbl">Ch ${ch}</span><span class="ch-name-lbl">${D.titles[ch]}</span></span>
    </button>`;
  }
  sb.innerHTML=h;
}

function buildDots(){
  const w=document.getElementById('pdots');
  w.innerHTML='';
  for(let ch=1;ch<=10;ch++){
    const d=document.createElement('div');
    d.className='pdot'+(ls.visited.has(ch)?' done':'')+(ls.ch===ch?' active':'');
    w.appendChild(d);
  }
  document.getElementById('visitedLbl').textContent=ls.visited.size+'/10 chapters';
}

// ── WELCOME ────────────────────────────────────────────────
function renderWelcome(){
  document.getElementById('learnMain').innerHTML=`
  <div class="welcome-screen">
    <div style="font-size:3rem;margin-bottom:18px;">📚</div>
    <h2>Choose a chapter to begin</h2>
    <p>Each chapter breaks down textbook concepts into expandable cards, with real-world business scenarios to cement understanding.</p>
    <div class="ch-grid" id="chGrid"></div>
  </div>`;
  buildChGrid();
}

function buildChGrid(){
  const g=document.getElementById('chGrid'); if(!g)return;
  let h='';
  for(let ch=1;ch<=10;ch++)
    h+=`<button class="ch-grid-btn" onclick="loadCh(${ch})"><div class="g-ico">${D.icons[ch]}</div><div class="g-n">Chapter ${ch}</div><div class="g-t">${D.titles[ch]}</div></button>`;
  g.innerHTML=h;
}

// ── LOAD CHAPTER ───────────────────────────────────────────
function loadCh(ch){
  ls.ch=ch; ls.section='concepts'; ls.visited.add(ch); ls.open=new Set();
  buildSidebar(); buildDots();
  renderLearn();
}

function renderLearn(){
  const ch=ls.ch; if(!ch){renderWelcome();return;}
  const concepts=D.concepts[ch], scenarios=D.scenarios[ch];
  const isScen=ls.section==='scenarios';
  let h=`<div class="ch-eyebrow">${D.icons[ch]} Chapter ${ch}</div>
  <h1 class="ch-title">${D.titles[ch]}</h1>
  <p class="ch-sub">Study the key concepts, then explore how they apply in real business situations.</p>
  <div class="sec-tabs">
    <button class="sec-tab${!isScen?' active':''}" onclick="setSection('concepts')">📖 Key Concepts (${concepts.length})</button>
    <button class="sec-tab${isScen?' active':''}" onclick="setSection('scenarios')">🌍 Real-World Scenarios (${scenarios.length})</button>
  </div>`;

  if(!isScen){
    h+='<div class="concepts-grid">';
    concepts.forEach((c,i)=>{
      const id=`c_${ch}_${i}`, open=ls.open.has(id);
      const body=fmtText(c.text);
      h+=`<div class="concept-card${open?' open':''}" id="${id}" onclick="toggleCard('${id}')">
        <div class="concept-hdr">
          <div class="concept-icon-box">${c.icon}</div>
          <div class="concept-title">${c.title}</div>
          <div class="concept-chevron">▾</div>
        </div>
        <div class="concept-body"><p>${body}</p></div>
      </div>`;
    });
    h+='</div>';
  } else {
    scenarios.forEach((s,i)=>{
      const body=fmtText(s.analysis);
      h+=`<div class="scenario-card">
        <div class="scen-hdr">
          <div class="scen-tag">🌍 Real-World Scenario ${i+1}</div>
          <div class="scen-title">${s.title}</div>
          <div class="scen-context">${s.context}</div>
        </div>
        <div class="scen-body">
          <div class="scen-analysis-lbl">✅ Analysis & Application</div>
          <div class="scen-analysis">${body}</div>
        </div>
      </div>`;
    });
  }

  const m=document.getElementById('learnMain');
  m.innerHTML=h; m.scrollTop=0; window.scrollTo(0,0);
}

function setSection(s){ ls.section=s; renderLearn(); }

function toggleCard(id){
  if(ls.open.has(id)){ ls.open.delete(id); document.getElementById(id).classList.remove('open'); }
  else { ls.open.add(id); document.getElementById(id).classList.add('open'); }
}

// ── QUIZ SETUP ─────────────────────────────────────────────
function buildQuizGrid(){
  const g=document.getElementById('quizGrid'); if(!g)return;
  let h='';
  for(let ch=1;ch<=10;ch++){
    const sc=qs.chScores[ch];
    h+=`<button class="qch-btn${qs.ch===ch?' sel':''}" id="qb${ch}" onclick="selQuizCh(${ch})">
      <div class="qico">${D.icons[ch]}</div>
      <div class="qn">Chapter ${ch}</div>
      <div class="qt">${D.titles[ch]}</div>
      ${sc?`<div class="qs-badge">✓ Best: ${sc.best}%</div>`:''}
    </button>`;
  }
  g.innerHTML=h;
}

function selQuizCh(ch){
  qs.ch=ch;
  document.querySelectorAll('.qch-btn').forEach(b=>b.classList.remove('sel'));
  document.getElementById('qb'+ch).classList.add('sel');
  document.getElementById('startBtn').disabled=false;
}

function setMode(m){
  qs.mode=m;
  document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('mode'+m.charAt(0).toUpperCase()+m.slice(1)).classList.add('active');
}

// ── START QUIZ ─────────────────────────────────────────────
function startQuiz(){
  const ch=qs.ch; if(!ch)return;
  let pool=D.questions[ch]||[];
  if(qs.mode==='standard') pool=pool.filter(q=>q.type==='standard');
  if(qs.mode==='scenario') pool=pool.filter(q=>q.type==='scenario');
  if(pool.length===0) pool=D.questions[ch]||[];
  qs.queue=shuffle([...pool]).slice(0,Math.min(15,pool.length));
  qs.idx=0; qs.score=0; qs.answered=false; qs.sel=null;
  document.getElementById('quizSetup').style.display='none';
  document.getElementById('resultsPanel').style.display='none';
  document.getElementById('quizActive').style.display='block';
  renderQ();
}

// ── RENDER QUESTION ────────────────────────────────────────
function renderQ(){
  const q=qs.queue[qs.idx], total=qs.queue.length;
  document.getElementById('qFill').style.width=(qs.idx/total*100)+'%';
  document.getElementById('qCounter').textContent=`Question ${qs.idx+1} of ${total}  ·  ${qs.score} correct`;
  const badge=document.getElementById('qBadge');
  if(q.type==='scenario'){badge.textContent='🌍 Scenario';badge.className='q-badge badge-scen';}
  else{badge.textContent='📝 Knowledge';badge.className='q-badge badge-std';}
  const sb=document.getElementById('qScenBox');
  if(q.type==='scenario'&&q.scenario){sb.style.display='block';document.getElementById('qScenText').textContent=q.scenario;}
  else{sb.style.display='none';}
  document.getElementById('qText').textContent=q.question;
  const letters=['A','B','C','D'];
  document.getElementById('qOpts').innerHTML=q.options.map((o,i)=>`
    <div class="q-opt" id="o${i}" onclick="selOpt(${i})">
      <div class="opt-ltr">${letters[i]}</div>
      <div class="opt-content"><div class="opt-text">${o.text}</div><div class="opt-explain">${o.explanation}</div></div>
    </div>`).join('');
  qs.answered=false; qs.sel=null;
  document.getElementById('qCheck').disabled=true;
  document.getElementById('qNext').style.display='none';
}

function selOpt(i){
  if(qs.answered)return;
  qs.sel=i;
  document.querySelectorAll('.q-opt').forEach((e,j)=>e.classList.toggle('sel',j===i));
  document.getElementById('qCheck').disabled=false;
}

function checkAnswer(){
  if(qs.answered||qs.sel===null)return;
  qs.answered=true;
  const correct=qs.queue[qs.idx].correct, sel=qs.sel;
  if(sel===correct)qs.score++;
  document.querySelectorAll('.q-opt').forEach((e,i)=>{
    e.classList.add('locked'); e.classList.remove('sel');
    if(i===correct)e.classList.add('correct');
    else if(i===sel)e.classList.add('wrong');
    else e.classList.add('dimmed');
  });
  document.getElementById('qCheck').disabled=true;
  const nb=document.getElementById('qNext');
  nb.style.display='inline-block';
  nb.textContent=qs.idx>=qs.queue.length-1?'See Results':'Next →';
}

function nextQuestion(){
  if(qs.idx>=qs.queue.length-1){showResults();return;}
  qs.idx++;
  renderQ();
}

function showResults(){
  document.getElementById('quizActive').style.display='none';
  document.getElementById('resultsPanel').style.display='block';
  const total=qs.queue.length, pct=Math.round(qs.score/total*100);
  document.getElementById('resPct').textContent=pct+'%';
  document.getElementById('resLbl').textContent=qs.score+' correct out of '+total+' questions';
  const g=document.getElementById('gradeEl');
  if(pct>=85){g.textContent='⭐ Excellent — A';g.className='grade-pill grade-a';}
  else if(pct>=70){g.textContent='✅ Good — B';g.className='grade-pill grade-b';}
  else if(pct>=55){g.textContent='⚠️ Needs Review — C';g.className='grade-pill grade-c';}
  else{g.textContent='📖 Study More — D';g.className='grade-pill grade-d';}
  document.getElementById('qFill').style.width='100%';
  if(!qs.chScores[qs.ch]||pct>qs.chScores[qs.ch].best)
    qs.chScores[qs.ch]={best:pct};
  buildQuizGrid();
}

function retryQuiz(){ startQuiz(); }
function backToSetup(){
  document.getElementById('resultsPanel').style.display='none';
  document.getElementById('quizActive').style.display='none';
  document.getElementById('quizSetup').style.display='block';
}

init();
</script>
</body>
</html>
