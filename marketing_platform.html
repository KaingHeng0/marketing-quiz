l."}, {"text": "Marketing departments are only needed in large companies", "explanation": "Incorrect. The book says even large companies may not need formal departments if orientation exists throughout."}], "correct": 0}, {"type": "standard", "question": "What four factors drive long-run business success according to the book's research?", "scenario": null, "options": [{"text": "Excellent core product, world-class operations, creative culture, and professional marketing", "explanation": "Correct. The book's research identifies these four, all organised around customers."}, {"text": "Market share, price leadership, advertising spend, and distribution coverage", "explanation": "Incorrect. These are tactical metrics, not the underlying drivers."}, {"text": "R&D investment, brand equity, customer service scores, and employee count", "explanation": "Incorrect. These are partial proxies, not the four factors identified."}, {"text": "Financial control, operational efficiency, HR management, and IT systems", "explanation": "Incorrect. These are supporting functions, not the four identified success drivers."}], "correct": 0}, {"type": "standard", "question": "Why does the book say cutting advertising during a recession is wrong?", "scenario": null, "options": [{"text": "Research shows maintaining or increasing marketing investment during downturns leads to stronger recovery and share gains", "explanation": "Correct. The book cites research including Nikbin et al. (2022) on Covid-19 showing cutting promotional spend during recession is precisely wrong."}, {"text": "Because advertising effectiveness cannot be measured", "explanation": "Incorrect. The argument is about long-term brand damage, not measurement difficulty."}, {"text": "Because competitors will immediately copy your advertising", "explanation": "Incorrect. Competitive mimicry is not the primary argument."}, {"text": "Because advertising agencies charge higher rates during recovery", "explanation": "Incorrect. Agency rates are not the reason — the argument is about brand investment continuity."}], "correct": 0}, {"type": "standard", "question": "What is the digital marketing maturity model used to assess?", "scenario": null, "options": [{"text": "The number of social media followers a brand has", "explanation": "Incorrect. Social media presence is a very narrow metric; maturity covers strategy, data, technology, and more."}, {"text": "A company's capability from Level 1 (Initial) to Level 5 (Optimised) across digital marketing dimensions", "explanation": "Correct. The model evaluates whether dedicated plans, resources, and measurement exist for each of seven digital marketing pillars."}, {"text": "The size of a company's digital advertising budget", "explanation": "Incorrect. The maturity model assesses capability across seven pillars, not just budget."}, {"text": "How technically advanced a company's website is", "explanation": "Incorrect. Website quality is one small component of the full maturity model."}], "correct": 1}, {"type": "standard", "question": "How does the book define a market?", "scenario": null, "options": [{"text": "An aggregation of customers sharing similar needs for products and services that best meet those needs", "explanation": "Correct. The book emphasises markets are groups of customers with similar needs — rarely one homogeneous mass."}, {"text": "A regulated exchange where buyers and sellers transact", "explanation": "Incorrect. That is a financial/economic definition; the marketing definition is customer-need based."}, {"text": "A geographic location where products are sold", "explanation": "Incorrect. Markets are not defined by geography but by customer groups and their needs."}, {"text": "Total revenue generated by all competitors in an industry", "explanation": "Incorrect. That describes industry revenue, not the definition of a market."}], "correct": 0}, {"type": "standard", "question": "What characterises a company with a production orientation rather than market orientation?", "scenario": null, "options": [{"text": "It invests heavily in R&D and innovation", "explanation": "Incorrect. R&D investment is not what defines production orientation — many market-oriented firms invest heavily in R&D."}, {"text": "It operates in manufacturing sectors rather than service sectors", "explanation": "Incorrect. Production orientation can occur in any sector including services."}, {"text": "It focuses on making what it is good at producing and then tries to sell it, rather than starting with customer needs", "explanation": "Correct. Production-oriented firms start with capability and push products to market; market-oriented firms start with customer needs."}, {"text": "It has a large and well-resourced marketing department", "explanation": "Incorrect. Having a marketing department is not the same as having market orientation."}], "correct": 2}, {"type": "scenario", "question": "What marketing principle best explains Nokia's collapse from 40% global mobile market share in 2007 to selling their phone division in 2013?", "scenario": "Nokia had the world's best-selling phones, superior hardware engineering, and the largest distribution network in mobile. Apple launched the iPhone in 2007. By 2013 Nokia had sold its phone division to Microsoft.", "options": [{"text": "Nokia had insufficient advertising budget compared to Apple", "explanation": "Incorrect. Nokia was one of the world's largest advertisers. Budget was not the issue."}, {"text": "Nokia expanded into too many geographic markets simultaneously", "explanation": "Incorrect. Geographic spread is not what explains the collapse."}, {"text": "Nokia priced their phones too high relative to Apple", "explanation": "Incorrect. Nokia actually had lower average selling prices than Apple — price was not the differentiator."}, {"text": "Nokia had product orientation — they focused on hardware excellence while the market shifted to wanting ecosystems, apps, and digital experiences", "explanation": "Correct. Nokia confused making good phones with understanding what customers wanted — which was digital life management, not just a voice device. Classic marketing concept failure."}], "correct": 3}, {"type": "scenario", "question": "A startup's sales team closes deals efficiently but 60% of clients cancel within 18 months citing the product does not solve their actual workflow problem. What is the root cause?", "scenario": "The startup developed B2B software based on what the founders thought businesses needed. Their sales team is excellent and has closed 80 accounts. Retention is catastrophic at 40%.", "options": [{"text": "Their pricing model is too high for the market", "explanation": "Incorrect. Customers specifically cite workflow mismatch, not price."}, {"text": "The product was built without sufficient understanding of what customers actually wanted — the marketing concept was never applied in product development", "explanation": "Correct. The 6-step marketing function starts with defining markets and quantifying needs — then developing propositions. This startup reversed the process."}, {"text": "They should increase advertising to drive more top-of-funnel leads", "explanation": "Incorrect. More leads into a product that does not fit customer needs scales the problem."}, {"text": "The sales team needs better objection-handling training", "explanation": "Incorrect. The problem is upstream — the product does not match real needs. Better selling of the wrong product accelerates failure."}], "correct": 1}, {"type": "standard", "question": "What does Adam Smith's 1776 statement — consumption is the sole end and purpose of production — describe in modern marketing terms?", "scenario": null, "options": [{"text": "Why governments should regulate advertising", "explanation": "Incorrect. No direct connection to advertising regulation."}, {"text": "The role of pricing in economic markets", "explanation": "Incorrect. Smith's statement is about the purpose of production, not the mechanism of pricing."}, {"text": "The marketing concept — that the purpose of business is to satisfy customer needs", "explanation": "Correct. The book uses this quote as the origin of the marketing concept: all production should be oriented toward satisfying consumers."}, {"text": "The importance of increasing industrial production", "explanation": "Incorrect. Smith's point was the opposite — production exists to serve consumption, not as an end in itself."}], "correct": 2}, {"type": "standard", "question": "What is the significance of the matching process in marketing?", "scenario": null, "options": [{"text": "Matching sales targets to production capacity", "explanation": "Incorrect. This is an operational planning concept, not the marketing matching process."}, {"text": "Matching company capabilities with customer wants within the constraints of the marketing environment", "explanation": "Correct. This three-way matching — capabilities plus customer wants plus environment — is described as fundamental to commercial success."}, {"text": "Matching advertising spend to revenue targets", "explanation": "Incorrect. The matching process refers to aligning company capabilities with customer wants — not budget matching."}, {"text": "Matching the firm's products to competitor products to ensure parity", "explanation": "Incorrect. Competitive parity is not the goal — differentiated value creation is."}], "correct": 1}, {"type": "scenario", "question": "A regional newspaper has lost 70% of print advertising revenue in 8 years. The CEO is investing in better printing technology and hiring more journalists. Circulation keeps declining. What should they do instead?", "scenario": "The newspaper's CEO believes quality journalism will always attract readers and advertisers. The editorial team is excellent. But readers are migrating to digital news sources and advertisers are following them.", "options": [{"text": "Increase print advertising rates to compensate for lower volume", "explanation": "Incorrect. Raising prices for a declining product accelerates advertiser departure."}, {"text": "Outsource editorial to reduce costs", "explanation": "Incorrect. Cost reduction does not solve the fundamental mismatch between offer and customer needs."}, {"text": "Conduct a thorough marketing audit: understand how target readers now consume news, then redesign the business model around those needs", "explanation": "Correct. The marketing concept requires starting with the customer. What format? Subscription? Podcast? Hyper-local community focus? Build the business around that answer."}, {"text": "Hire even more journalists — quality content will always attract readers", "explanation": "Incorrect. Content quality is important but does not address how readers now want to consume it."}], "correct": 2}, {"type": "standard", "question": "Which statement about B2B, consumer, and service marketing is most accurate?", "scenario": null, "options": [{"text": "B2B marketing requires completely different principles from consumer marketing", "explanation": "Incorrect. The book explicitly states the central ideas of marketing are universal across all sectors."}, {"text": "Service marketing is simpler than product marketing because services have fewer variables", "explanation": "Incorrect. The opposite is true — services are more complex due to intangibility, heterogeneity, perishability, and inseparability."}, {"text": "Consumer marketing is the only context where branding is relevant", "explanation": "Incorrect. B2B branding examples like Intel and Caterpillar contradict this."}, {"text": "The central ideas of marketing are universal — differences exist only in emphasis and implementation", "explanation": "Correct. The book states the central ideas of marketing make no difference whether we are marketing furnaces, insurance policies, or margarine."}], "correct": 3}], "2": [{"type": "standard", "question": "What is marketing planning as defined in Chapter 2?", "scenario": null, "options": [{"text": "Forecasting sales and allocating the sales budget", "explanation": "Incorrect. Sales forecasting is an output of planning, not the definition."}, {"text": "The annual budgeting process for the marketing department", "explanation": "Incorrect. Planning is far broader than budgeting."}, {"text": "Designing advertising campaigns for the coming year", "explanation": "Incorrect. Advertising is one element — planning covers total strategic direction."}, {"text": "A logical sequence of activities leading to setting marketing objectives and formulating plans to achieve them", "explanation": "Correct. This is the book's definition — a disciplined strategic thinking process."}], "correct": 3}, {"type": "standard", "question": "What is the correct sequence of the first four steps in the 10-step marketing planning process?", "scenario": null, "options": [{"text": "Mission then corporate objectives then marketing audit then SWOT", "explanation": "Correct. Direction first, then understanding, then diagnosis."}, {"text": "Audit then mission then SWOT then objectives", "explanation": "Incorrect. Mission comes first to provide context for everything else."}, {"text": "SWOT then mission then audit then objectives", "explanation": "Incorrect. You cannot do SWOT before the audit provides the data."}, {"text": "Set budget then audit then objectives then mission", "explanation": "Incorrect. Budgets come near the end — mission and direction come first."}], "correct": 0}, {"type": "standard", "question": "What distinguishes a strategic from a tactical marketing plan?", "scenario": null, "options": [{"text": "Strategic covers 3+ years and sets direction; tactical is the detailed first-year execution of the strategic plan", "explanation": "Correct. Strategic equals long-term direction. Tactical equals scheduled, costed Year 1 execution."}, {"text": "Strategic plans focus on pricing; tactical on promotion", "explanation": "Incorrect. Both address all marketing mix elements at different levels of detail."}, {"text": "Strategic plans are created by senior management; tactical by junior staff", "explanation": "Incorrect. Who creates them is not the defining distinction."}, {"text": "Tactical plans are for consumer markets; strategic for B2B", "explanation": "Incorrect. Both types apply in all market contexts."}], "correct": 0}, {"type": "standard", "question": "What is a marketing audit?", "scenario": null, "options": [{"text": "A customer satisfaction survey", "explanation": "Incorrect. Customer data may feed the audit but is not the audit itself."}, {"text": "A review by external auditors to verify marketing claims", "explanation": "Incorrect. While external parties can conduct it, the purpose is strategic understanding."}, {"text": "A thorough, systematic, critical and unbiased review of the marketing environment, operations, objectives, strategies and activities", "explanation": "Correct. This is the book's definition — covering both internal and external dimensions."}, {"text": "An annual financial review of marketing spending", "explanation": "Incorrect. A marketing audit reviews the environment and marketing operations strategically — not just finances."}], "correct": 2}, {"type": "standard", "question": "In a SWOT analysis, which elements are internal?", "scenario": null, "options": [{"text": "Opportunities and Threats", "explanation": "Incorrect. O and T are external — from the environment and competition."}, {"text": "Strengths and Opportunities", "explanation": "Incorrect. Opportunities are external — market gaps the firm can exploit."}, {"text": "Strengths and Weaknesses", "explanation": "Correct. S and W are internal — within the firm's control. O and T are external."}, {"text": "Weaknesses and Threats", "explanation": "Incorrect. Threats are external."}], "correct": 2}, {"type": "standard", "question": "What belongs in the strategic marketing plan versus the marketing audit ction — rigorous upfront planning is the solution."}, {"text": "Execution capability matters more than strategy quality", "explanation": "Incorrect. The quote warns against exactly this thinking."}, {"text": "Strategic direction must be correct before execution is optimised — brilliant execution of the wrong strategy accelerates failure", "explanation": "Correct. Strategy must come first. The most polished execution of a flawed strategy gets you to failure faster."}, {"text": "Speed of implementation is the most critical success factor", "explanation": "Incorrect. Speed of implementing the wrong strategy just reaches failure faster."}], "correct": 2}, {"type": "scenario", "question": "A consumer goods company completes an audit showing their flagship product is in late-stage maturity with declining margins. The CEO approves a plan doubling advertising and sets the same market share target as last year. What planning failure is this?", "scenario": "The audit was conducted by an external consultancy and took three months. The findings were clear: the product category is shrinking, margins are at a ten-year low, and a new competitor has entered. The CEO reviewed the audit but felt the brand was still strong.", "options": [{"text": "The planning process failed — the audit identified the problem but strategy was not adjusted to respond", "explanation": "Correct. Classic failure mode: rigorous audit ignored in planning output. Strategy must respond to what the audit reveals."}, {"text": "Increased advertising is always the right response to competitive pressure", "explanation": "Incorrect. Late maturity requires strategic response — repositioning or new segments — not just tactical advertising."}, {"text": "The CEO correctly identified that advertising can reverse product maturity", "explanation": "Incorrect. Advertising alone cannot reverse structural market dynamics in late maturity."}, {"text": "Market share targets should never be changed year-on-year", "explanation": "Incorrect. Targets must reflect market realities."}], "correct": 0}, {"type": "scenario", "question": "A fast-growing tech startup's CEO manages all marketing decisions from memory and makes all pricing and promotion decisions intuitively. The company just announced expansion into three new countries. What planning issue does this illustrate?", "scenario": "The startup has grown from 5 to 120 employees in three years. The CEO personally knows the top 40 customers. The company has no documented marketing strategy, no brand guidelines, and no pricing policy document.", "options": [{"text": "International expansion does not require planning — what works at home works abroad", "explanation": "Incorrect. New markets require formal audits, segmentation analysis, and adapted strategies."}, {"text": "The company should hire a marketing director to replace the CEO", "explanation": "Incorrect. Personnel change alone does not solve the structural problem — systematisation is needed."}, {"text": "As complexity grows, informal planning must give way to systematised marketing planning", "explanation": "Correct. The book says larger, more diversified organisations need systematised planning. International expansion makes informal management impossible."}, {"text": "The CEO's intuitive approach is a strength and should be preserved during expansion", "explanation": "Incorrect. Informal, person-dependent systems break down catastrophically with scale and geography."}], "correct": 2}, {"type": "scenario", "question": "A retailer produces an 80-page marketing plan containing raw sales data, transaction records, competitor price tables, and survey appendices — all presented to the board in full detail. What is wrong?", "scenario": "The marketing team spent three months producing the plan. The board presentation lasted 4 hours. Board members complained they could not identify the strategic priorities.", "options": [{"text": "The plan contains raw audit data that belongs in the separat uirements."}, {"text": "Large multinationals should use standardised global templates", "explanation": "Incorrect. Even multinationals must adapt planning to local market conditions."}, {"text": "Off-the-peg works for small companies but not large ones", "explanation": "Incorrect. The book makes no such size distinction."}], "correct": 1}], "3": [{"type": "standard", "question": "What is the difference between a customer and a consumer?", "scenario": null, "options": [{"text": "Customers are loyal repeat buyers; consumers are one-time purchasers", "explanation": "Incorrect. Loyalty is behavioural — not what defines this distinction."}, {"text": "Customers are business buyers; consumers are individual buyers", "explanation": "Incorrect. The distinction is buyer versus user, not B2B versus B2C."}, {"text": "They are interchangeable terms", "explanation": "Incorrect. The book explicitly distinguishes them — they play different roles in the buying process."}, {"text": "A customer is the buyer; a consumer is the user of the product or service", "explanation": "Correct. A husband (customer) buys perfume for his wife (consumer). Marketers must understand both."}], "correct": 3}, {"type": "standard", "question": "Why is correct market definition critical?", "scenario": null, "options": [{"text": "It affects the company's legal classification", "explanation": "Incorrect. Legal classification is irrelevant to the marketing rationale."}, {"text": "Investors judge companies by total addressable market size", "explanation": "Incorrect. The book's reasoning is strategic, not about investor relations."}, {"text": "Broader definitions always lead to higher market share figures", "explanation": "Incorrect. Broad definitions artificially dilute share — the goal is accuracy, not a favourable number."}, {"text": "It determines market share measurement, target customers, relevant competitors, and appropriate objectives", "explanation": "Correct. Wrong market definition corrupts all four strategic dimensions simultaneously."}], "correct": 3}, {"type": "standard", "question": "What does the Pareto 80/20 effect reveal about customer bases?", "scenario": null, "options": [{"text": "80% of marketing spend generates 80% of returns", "explanation": "Incorrect. The Pareto principle is about customer value distribution, not spend efficiency."}, {"text": "Approximately 80% of revenue comes from approximately 20% of customers", "explanation": "Correct. A small proportion of customers generates the majority of revenue — with profound implications for resource allocation."}, {"text": "80% of new products fail in their first year", "explanation": "Incorrect. Product failure rates are high, but this is not Pareto analysis in Chapter 3's context."}, {"text": "20% of advertising spend is always wasted", "explanation": "Incorrect. Pareto here refers to customer value distribution, not advertising efficiency."}], "correct": 1}, {"type": "standard", "question": "What four criteria define a valid market segment?", "scenario": null, "options": [{"text": "Members are similar to each other; sufficiently large; descriptors enable communication; responds differently to different marketing mixes than other segments", "explanation": "Correct. All four criteria must be met for a group to be a genuine, actionable segment."}, {"text": "Growing, profitable, accessible, and competitive", "explanation": "Incorrect. These are market attractiveness criteria, not segment definition criteria."}, {"text": "Size, geography, purchase frequency, price sensitivity", "explanation": "Incorrect. These are segmentation variables, not validity criteria."}, {"text": "Age, income, location, and lifestyle similarity", "explanation": "Incorrect. These are demographic bases — not the criteria for segment validity."}], "correct": 0}, {"type": "standard", "question": "What is the correct 5-step market segmentation process?", "scenario": null, "options": [{"text": "Define market then market mapping then list decision makers then understand WHY they buy then cluster into segments", "explanation": "Correct. This is the book's exact 5-step rigorous segmentation process."}, {"text": "Set objectives then choose bases then collect data then analyse then select segments", "explanation": "Incorrect. Generic research process — does not match the book's specific methodology."}, {"text": "Survey then analyse then create personas then test messaging then launch", "explanation": "Incorrect. This is a communications process, not the segmentation process."}, {"text": "Identify competitors then map segments then find gaps then target then position", "explanation": "Incorrect. This is competitive positioning, not the segmentation process."}], "correct": 0}, {"type": "standard", "question": "What is disintermediation?", "scenario": null, "options": [{"text": "Removing intermediaries from the supply chain — producers selling directly to end users online", "explanation": "Correct. E-commerce enabled many businesses to bypass traditional middlemen and sell direct-to-consumer."}, {"text": "Segmenting markets using digital data", "explanation": "Incorrect. Digital segmentation is a separate concept entirely."}, {"text": "Offering discounts to customers who buy directly online", "explanation": "Incorrect. Pricing incentives are not what defines disintermediation."}, {"text": "Adding new digital intermediaries between producers and consumers", "explanation": "Incorrect. That is reintermediation."}], "correct": 0}, {"type": "standard", "question": "What does market mapping involve?", "scenario": null, "options": [{"text": "Identifying ALL routes between producers and final users, including all intermediaries", "explanation": "Correct. Market mapping draws the complete picture of how products reach customers — all intermediaries, routes, and touchpoints."}, {"text": "Geographic heat maps of customer locations", "explanation": "Incorrect. Market mapping is about supply chain routes, not geo stainability practices and energy consumption", "explanation": "Incorrect. The environmental audit reviews the MACRO environment, not internal sustainability practices."}, {"text": "An audit of the company's carbon footprint only", "explanation": "Incorrect. Carbon footprint is part of environmental sustainability but the audit is far broader."}], "correct": 1}, {"type": "standard", "question": "What is reintermediation?", "scenario": null, "options": [{"text": "Reintermediation only occurs in B2C markets", "explanation": "Incorrect. B2B markets have also seen new digital intermediaries emerge."}, {"text": "New types of digital intermediaries emerge as traditional ones are bypassed — threats and opportunities simultaneously", "explanation": "Correct. As airlines removed travel agents, Booking.com appeared. As publishers went online, Amazon appeared. New intermediaries can be more powerful than old ones."}, {"text": "Re-establishing old intermediaries after e-commerce disruption", "explanation": "Incorrect. Reintermediation is about NEW intermediaries emerging, not restoring old ones."}, {"text": "Reintermediation always reduces costs for all parties", "explanation": "Incorrect. New intermediaries often extract significant margin and may increase costs."}], "correct": 1}, {"type": "scenario", "question": "A premium chocolate company is in the confectionery market at 2% share. A consultant says they are in the premium gifting market at 18% share. Who is right?", "scenario": "The company's actual competitors are premium biscuits, luxury candles, and artisan wine — not supermarket confectionery brands. Their customers cite gifting as the primary purchase occasion.", "options": [{"text": "The broader definition is always better for planning", "explanation": "Incorrect. Too broad a definition creates a false picture of competitive position."}, {"text": "The consultant — the correct market definition reflects who customers actually choose between when making a purchase decision", "explanation": "Correct. Customers buying luxury chocolate gifts are NOT choosing between it and a Mars bar. The relevant competitive set defines the true market."}, {"text": "Market definition does not matter as long as product quality is high", "explanation": "Incorrect. Wrong market definition leads to wrong competitors, wrong objectives, wrong strategies."}, {"text": "The company — market share is always calculated at the broadest industry level", "explanation": "Incorrect. Market share is only meaningful relative to the correctly defined competitive set."}], "correct": 1}, {"type": "scenario", "question": "A B2B software company targets mid-size businesses with revenues between 10 and 50 million and treats them identically. Conversion is low and sales cycles long. What is missing?", "scenario": "Their marketing uses generic messaging for all accounts. A 10 million pound manufacturing firm and a 50 million pound SaaS company receive identical outreach. The sales team spends equal time on both types.", "options": [{"text": "Mid-size businesses are too hard to sell to — pivot to enterprise", "explanation": "Incorrect. The problem is the undifferentiated approach, not the segment itself."}, {"text": "They should lower price to accelerate sales cycles", "explanation": "Incorrect. Price may be one factor, but the core issue is treating a diverse group as homogeneous."}, {"text": "They need a better CRM system", "explanation": "Incorrect. Better data does not help without the segmentation framework to make it actionable."}, {"text": "The segment is too broad — within it, buying behaviour, decision makers, and needs vary enormously by sector, growth stage, and digital maturity", "explanation": "Correct. Sub-segmentation by industry vertical and digital maturity would dramatically improve targeting effectiveness."}], "correct": 3}], "4": [{"type": "standard", "question": "What does the Coca-Cola and Pepsi taste test prove about customer behaviour?", "scenario": null, "options": [{"text": "Customers make decisions based on emotional and brand factors rather than purely rational product assessment", "explanation": "Correct. In blind tests, most prefer Pepsi. With labels visible, most prefer Coke. Brand perception overrides actual taste."}, {"text": "Pepsi is objectively better than Coca-Cola", "explanation": "Incorrect. The point is not about objective quality — it is about the irrational role of brand in decisions."}, {"text": "Taste is the primary driver of beverage market share", "explanation": "Incorrect. The experiment proves the opposite."}, {"text": "Advertising spend determines consumer preference", "explanation": "Incorrect. Brand perception — driven by many factors — overrides product reality."}], "correct": 0}, {"type": "standard", "question": "What does the book say about traditional market research asking customers what they want?", "scenario": null, "options": [{"text": "It works for B2B but not B2C", "explanation": "Incorrect. The irrationality of buyers affects both markets."}, {"text": "It is the gold standard of customer insight", "explanation": "Incorrect. The book warns strongly against this approach."}, {"text": "It is effective with large enough sample sizes", "explanation": "Incorrect. Scale does not fix the problem — rational responses still will not predict irrational behaviour."}, {"text": "It is largely wasted — customers give rational answers that do not reflect actual irrational behaviour", "explanation": "Correct. The book says most market research is wasted for exactly this reason."}], "correct": 3}, {"type": "standard", "question": "What is a value proposition as defined in Chapter 4?", "scenario": null, "options": [{"text": "The marketing message used in advertising", "explanation": "Incorrect. Communications express the proposition — they are not the proposition itself."}, {"text": "How the firm's offer helps customers achieve their goals — functional, economic, and emotional value combined", "explanation": "Correct. Value relates to customer goal achievement across multiple dimensions."}, {"text": "The unique selling point compared to competitors", "explanation": "Incorrect. USP is part of the picture, but value proposition is broader."}, {"text": "A pricing strategy that offers value for money", "explanation": "Incorrect. Value proposition is not about pricing — it is about how the offer helps customers achieve their goals."}], "correct": 1}, {"type": "standard", "question": "What is the critical rule about SWOT headings?", "scenario": null, "options": [{"text": "Each entry must be specific and evidence-based — vague entries like customer service are meaningless without qualification", "explanation": "Correct. The book warns against meaningless SWOT entries. Specific, measurable, evidence-based entries are required."}, {"text": "SWOTs should be kept confidential", "explanation": "Incorrect. SWOTs must be shared across the organisation to guide strategy."}, {"text": "SWOT headings should be broad to cover as many scenarios as possible", "explanation": "Incorrect. Broad, vague headings are explicitly criticised."}, {"text": "The Threats section is most important — focus resources here", "explanation": "Incorrect. All four sections matter; strategy emerges from their interaction."}], "correct": 0}, {"type": "standard", "question": "What role does the ventromedial prefrontal cortex play in brand preference?", "scenario": null, "options": [{"text": "It controls memory of past advertising", "explanation": "Incorrect. Advertising memory may create associations but the VMPC's role is emotional decision-making."}, {"text": "It controls rational price-comparison calculations", "explanation": "Incorrect. The VMPC is associated with emotional processing, not rational calculation."}, {"text": "It is the neural substrate for brand-based emotional preference — VMPC-damaged patients do not show brand preference and revert to rational product assessment", "explanation": "Correct. Neurological research confirms brand preference is emotional, not rational — VMPC damage eliminates it."}, {"text": "It processes value-for-money ratios", "explanation": "Incorrect. Value calculation is rational — the VMPC handles emotional decision-making."}], "correct": 2}, {"type": "standard", "question": "According to Chapter 4, what is the primary source of differentiation?", "scenario": null, "options": [{"text": "Price — being the cheapest option in the market", "explanation": "Incorrect. Price leadership is one competitive strategy, not the primary source of differentiation in Chapter 4."}, {"text": "Needs-based segmentation — serving specific segment needs better than competitors", "explanation": "Correct. The book states differentiation will mainly be achieved through needs-based segmentation rather than through products or services."}, {"text": "Brand advertising and promotional spend", "explanation": "Incorrect. Communications express differentiation — they do not create the underlying differentiation."}, {"text": "Product features and technical specifications", "explanation": "Incorrect. Product differentiation is easily copied."}], "correct": 1}, {"type": "standard", "question": "In the 11-step value proposition process, what does Step 8 ROI category mean?", "scenario": null, "options": [{"text": "The customer's corporate return on invested capital", "explanation": "Incorrect. Step 8 classifies the TYPE of value delivered, not the customer's overall financial metrics."}, {"text": "Whether the value delivered reduces a cost, avoids a cost, or increases the customer's revenue", "explanation": "Correct. Three categories: reduce cost for efficiency, avoid cost for risk mitigation, increase revenue for growth. Quantifying which makes the proposition financially concrete."}, {"text": "The payback period for implementing the solution", "explanation": "Incorrect. Payback period is an output of the financial model at step 11, not step 8."}, {"text": "The marketing department's return on advertising spend", "explanation": "Incorrect. ROI category refers to how the offer creates value for the CUSTOMER."}], "correct": 1}, {"type": "scenario", "question": "A B2B cleaning company claims we clean better but rarely wins new clients. When they quantify 40% fewer contamination incidents preventing 85,000 pounds in annual fines, contract wins triple. What principle does this illustrate?", "scenario": "The company had used the same generic quality claim for 5 years. A consultant helped them build a financial model of the value delivered. The same product, now with a quantified value proposition.", "options": [{"text": "Moving from a vague feature claim to a financially quantified value proposition dramatically changes buyer behaviour", "explanation": "Correct. This is the 11-step process in action — from we clean better (vague) to 85,000 pounds prevented annually (quantified economic value)."}, {"text": "Case studies always outperform feature messaging", "explanation": "Incorrect. The case study is the evidence for the proposition — the proposition itself is the financial quantification."}, {"text": "B2B buyers only respond to fear of regulatory risk", "explanation": "Incorrect. The insight is about quantified value generally, not specifically fear-based appeals."}, {"text": "Price is the real issue — they should reduce their rates", "explanation": "Incorrect. The breakthrough came from quantifying value, not changing price."}], "correct": 0}, {"type": "scenario", "question": "A luxury car manufacturer's focus groups say buyers choose on safety, fuel economy, reliability. But purchase data shows colour, interior smell, and steering wheel feel are the real discriminators. What does this illustrate?", "scenario": "The manufacturer invested heavily in safety and fuel economy improvements based on focus group feedback. Market share did not move. A data team then examined actual purchase records alongside post-purchase satisfaction surveys.", "options": [{"text": "Customers are untrustworthy and their input should be ignored", "explanation": "Incorrect. The point is not distrust — stated rational preferences genuinely diverge from actual behavioural drivers."}, {"text": "Safety and fuel economy must be improved to win in premium cars", "explanation": "Incorrect. The research shows these are NOT the actual discriminators — despite customers saying they are."}, {"text": "Customers are not rational — stated preferences diverge from actual buying behaviour — research must observe behaviour, not just ask questions", "explanation": "Correct. This perfectly illustrates the book's core argument. Observational and behavioural research is more reliable than direct questioning."}, {"text": "Focus groups should be replaced with larger quantitative surveys", "explanation": "Incorrect. Larger surveys of rational self-reports still will not capture irrational behavioural drivers."}], "correct": 2}, {"type": "standard", "question": "Why does the book say customers do not know what they want?", "scenario": null, "options": [{"text": "Companies should ignore customer input and rely on internal R&D", "explanation": "Incorrect. The insight is about HOW to research customers — observe rather than ask — not whether to involve them."}, {"text": "Marketing research is therefore unnecessary", "explanation": "Incorrect. Research is still essential — but observational and behavioural, not just asking people what they want."}, {"text": "This only applies to technology products", "explanation": "Incorrect. The book applies this universally."}, {"text": "Customers want better solutions to their problems — marketing's task is to discover those problems deeply", "explanation": "Correct. The book says customers want better ways to solve problems. Marketing discovers those problems; customers do not design solutions."}], "correct": 3}], "5": [{"type": "standard", "question": "What is a brand as defined in Chapter 5?", "scenario": null, "options": [{"text": "Total marketing spend invested in a product", "explanation": "Incorrect. Investment builds brands — it is not what a brand IS."}, {"text": "The logo and visual identity", "explanation": "Incorrect. A logo is one brand element — the brand is the full promise and experience."}, {"text": "The premium price charged above commodity alternatives", "explanation": "Incorrect. Price premium is an outcome of strong brand equity, not the definition of brand."}, {"text": "A name, sign, symbol, slogan or design intended to identify goods and services and differentiate them from competitors", "explanation": "Correct. Brands are differentiators and promise-makers, not just visual marks."}], "correct": 3}, {"type": "standard", "question": "What are the four Product Lifecycle stages?", "scenario": null, "options": [{"text": "Launch, Scale, Defend, Exit", "explanation": "Incorrect. These are strategic phases but not the PLC stage names."}, {"text": "Awareness, Trial, Adoption, Loyalty", "explanation": "Incorrect. These are buyer adoption stages, not product lifecycle stages."}, {"text": "Introduction, Growth, Maturity, Decline", "explanation": "Correct. Four stages, each with distinct sales trajectory, profit level, competition intensity, and required strategy."}, {"text": "Development, Launch, Growth, Harvest", "explanation": "Incorrect. Development is pre-launch and not one of the four core PLC stages."}], "correct": 2}, {"type": "standard", "question": "In Rogers' Diffusion of Innovation, what percentage are Early Adopters?", "scenario": null, "options": [{"text": "2.5%", "explanation": "Incorrect. 2.5% are Innovators — the very first adopters with highest risk tolerance."}, {"text": "34%", "explanation": "Incorrect. 34% applies to both Early Majority and Late Majority."}, {"text": "13.5%", "explanation": "Correct. Early Adopters are 13.5% — opinion leaders who influence the Early Majority."}, {"text": "16%", "explanation": "Incorrect. 16% nies gain service experience", "explanation": "Incorrect. Related but different concept."}, {"text": "Unit costs fall predictably as cumulative production doubles — giving higher-share companies a structural cost advantage", "explanation": "Correct. Each doubling of cumulative output produces a 20-30% unit cost reduction. This is the economic foundation of market share strategy."}], "correct": 3}, {"type": "standard", "question": "How does the Directional Policy Matrix differ from the Boston Matrix?", "scenario": null, "options": [{"text": "DPM uses multiple factors per axis — Business Strength and Market Attractiveness — versus BCG's two single metrics", "explanation": "Correct. BCG uses only market share and market growth. DPM uses composite scores across multiple factors — more nuanced and realistic."}, {"text": "DPM has five cells; BCG has four", "explanation": "Incorrect. DPM has a 9-cell grid; BCG has 4 quadrants."}, {"text": "BCG is more sophisticated than DPM", "explanation": "Incorrect. DPM is considered MORE sophisticated because it incorporates multiple strategic dimensions."}, {"text": "DPM is for services; BCG is for products", "explanation": "Incorrect. Both can apply to products and services."}], "correct": 0}, {"type": "standard", "question": "What is category management?", "scenario": null, "options": [{"text": "Managing the product development pipeline by category", "explanation": "Incorrect. Pipeline management is an innovation process, not category management."}, {"text": "Categorising customers into segments for targeting", "explanation": "Incorrect. That is market segmentation."}, {"text": "Managing the marketing budget across product categories", "explanation": "Incorrect. Category management is a retailer-manufacturer collaboration approach, not a budgeting process."}, {"text": "Managing product categories as strategic business units, with retailers and manufacturers collaborating to optimise total category performance", "explanation": "Correct. The category — not individual brands — is the unit of management."}], "correct": 3}, {"type": "scenario", "question": "Product A has 40% share in a 15% growth market. Product B has 35% share in a 2% growth market. Product C has 5% share in an 18% growth market. What BCG strategy applies to each?", "scenario": "A consumer goods company needs to allocate its marketing investment budget across its three main products. The finance team wants equal investment across all three products.", "options": [{"text": "A is a Star — invest heavily; B is a Cash Cow — harvest to fund A; C is a Question Mark — invest selectively or divest", "explanation": "Correct. A is a Star in high growth needing investment. B is a Cash Cow generating cash in low growth. C is a Question Mark requiring a strategic decision."}, {"text": "Divest all three and fund new product development", "explanation": "Incorrect. Divesting a Star and Cash Cow would be strategically catastrophic."}, {"text": "Invest equally in all three", "explanation": "Incorrect. Equal investment ignores dramatically different strategic positions."}, {"text": "A is a Cash Cow; B is a Star; C is a Dog", "explanation": "Incorrect. These classifications are wrong based on the share and growth data given."}], "correct": 0}, {"type": "scenario", "question": "A pharma company's blockbuster drug generates 800 million pounds per year. Patents expire in 18 months. R&D is 90% focused on line extensions of this drug. What should the PLC analysis recommend?", "scenario": "Sales have been flat for 3 years as generic competitors prepare to enter post-patent. The CEO is confident that brand loyalty will sustain pricing after patent expiry based on historical precedent from 15 years ago.", "options": [{"text": "Increase advertising to defend market share before patent expiry", "explanation": "Incorrect. Generic competition will collapse prices structurally — advertising cannot defend against this economic force."}, {"text": "Recognise late Maturity and early Decline and urgently reallocate R&D to next-generation pipeline products", "explanation": "Correct. The Cash Cow is near its end. Build the next generation while current revenues still fund R&D investment."}, {"text": "Discontinue the drug immediately", "explanation": "Incorrect. 18 months of 800 million pounds revenue should be harvested — do not abandon it prematurely."}, {"text": "Acquire generic manufacturers to control the post-patent market", "explanation": "Incorrect. Strategically complex and potentially anticompetitive — and does not solve the pipeline gap."}], "correct": 1}, {"type": "standard", "question": "Why is a balanced product portfolio strategically important?", "scenario": null, "options": [{"text": "Regulatory requirements mandate diversified portfolios", "explanation": "Incorrect. Portfolio balance is a strategic choice, not a regulatory requirement."}, {"text": "To reduce the marketing team's workload", "explanation": "Incorrect. Portfolio balance is about financial sustainability, not workload."}, {"text": "Multiple products prevent cannibalisation", "explanation": "Incorrect. Cannibalisation is real but not the primary reason portfolio balance matters strategically."}, {"text": "Cash Cows fund Stars which become future Cash Cows — sustainable revenue requires products at different lifecycle stages simultaneously", "explanation": "Correct. Without Cash Cows there is no funding. Without Stars there is no future. Portfolio balance provides continuity across time."}], "correct": 3}, {"type": "scenario", "question": "A smart home energy system startup has 12% ready to buy immediately and 88% saying wait and see. What Diffusion of Innovation strategy should be used?", "scenario": "The product cuts energy bills by 40%. The startup has a limited budget and must decide where to focus first — the 12% ready to buy or the 88% who are hesitant.", "options": [{"text": "Focus on the 88% with price reductions", "explanation": "Incorrect. Price reduction does not move people in wait-and-see mode — social proof does."}, {"text": "Target the 12% Innovators and Early Adopters first — their visible adoption creates the social proof that moves the Early Majority", "explanation": "Correct. The wait-and-see majority will only adopt once respected peers have validated the technology. Social proof is the bridge to mass adoption."}, {"text": "Launch mass-market TV advertising to reach all segments at once", "explanation": "Incorrect. Mass launch wastes resources on Late Majority and Laggards who are not ready."}, {"text": "License the technology to a larger company", "explanation": "Incorrect. Licensing is a business model decision, not a Diffusion of Innovation strategy."}], "correct": 1}], "6": [{"type": "standard", "question": "What is the difference between a marketing objective and a marketing strategy?", "scenario": null, "options": [{"text": "Objectives state WHAT to achieve in terms of products and markets; strategies state HOW to achieve it", "explanation": "Correct. Objectives define desired outcomes. Strategies define the approach taken to achieve them."}, {"text": "Objectives are created by the board; strategies by the marketing team", "explanation": "Incorrect. Who creates them may vary — the distinction is conceptual, not hierarchical."}, {"text": "Objectives are long-term; strategies are short-term", "explanation": "Incorrect. Both operate across time horizons. The distinction is WHAT versus HOW."}, {"text": "Strategies are about market share; objectives are about profit", "explanation": "Incorrect. Both can address share, profit, and other dimensions."}], "correct": 0}, {"type": "standard", "question": "What does SMART mean when applied to marketing objectives?", "scenario": null, "options": [{"text": "Sales-driven, Marketing-approved, Affordable, Replicable, Trackable", "explanation": "Incorrect. Not the SMART framework."}, {"text": "Specific, Measurable, Achievable, Relevant, Time-bound", "explanation": "Correct. All five criteria must be met for an objective to be actionable and evaluable."}, {"text": "Segment-based, Market-focused, Achievable, Revenue-linked, Timed", "explanation": "Incorrect. This is a marketing-themed misremembering of the acronym."}, {"text": "Strategic, Measurable, Achievable, Relevant, Tactical", "explanation": "Incorrect. SMART stands for Specific, Measurable, Achievable, Relevant, Time-bound."}], "correct": 1}, {"type": "standard", "question": "What are the four Ansoff Matrix options in order from lowest to highest risk?", "scenario": null, "options": [{"text": "Diversification then Market Development then Product Development then Market Penetration", "explanation": "Incorrect. This is the reverse of the correct risk order."}, {"text": "Market Development then Diversification then Penetration then Product Development", "explanation": "Incorrect. Market penetration is always lowest risk; diversification always highest."}, {"text": "Market Penetration then Product Development then Market Development then Diversification", "explanation": "Correct. Penetration with known products and known markets is lowest risk. Diversification with new products and new markets is highest."}, {"text": "Product Development then Market Penetration then Diversification then Market Development", "explanation": "Incorrect. This ordering is incorrect."}], "correct": 2}, {"type": "standard", "question": "What are Porter's three generic competitive strategies?", "scenario": null, "options": [{"text": "Cost Leadership, Differentiation, Focus or Niche", "explanation": "Correct. Compete on lowest cost, compete on uniqueness and quality premium, or serve a specific segment exceptionally well."}, {"text": "Penetration, Development, Diversification", "explanation": "Incorrect. These are Ansoff Matrix growth options, not Porter's competitive strategies."}, {"text": "Attack, Defend, Harvest", "explanation": "Incorrect. These are competitive postures, not Porter's formal framework."}, {"text": "Pioneer, Fast Follower, Late Mover", "explanation": "Incorrect. Market entry timing strategies, not Porter's competitive strategies."}], "correct": 0}, {"type": "standard", "question": "What is gap analysis in marketing planning?", "scenario": null, "options": [{"text": "The gap between quality standards and customer expectations", "explanation": "Incorrect. That is ServQual service quality gap analysis."}, {"text": "The difference between where corporate objectives want the company to be and where it will be if it does nothing — this gap must be filled by strategy", "explanation": "Correct. Gap analysis identifies how much additional growth is needed beyond the do-nothing forecast, determining the required strategic ambition."}, {"text": "The gap between planned marketing spend and actual spend", "explanation": "Incorrect. Budget variance is financial management, not marketing planning gap analysis."}, {"text": "Analysing gaps in a competitor's product range to find market opportunities", "explanation": "Incorrect. Competitive gap analysis is a different tool."}], "correct": 1}, {"type": "standard", "question": "What is the stuck in the middle danger in Porter's framework?", "scenario": null, "options": [{"text": "Companies attempting Cost Leadership AND Differentiation simultaneously achieve neither — resulting in average performance everywhere", "explanation": "Correct. Porter warns that strategic incoherence produces competitive mediocrity."}, {"text": "Mid-tier employees are most likely to leave the company", "explanation": "Incorrect. This is an HR concept entirely unrelated to Porter's framework."}, {"text": "Companies targeting the mid-market will always underperform", "explanation": "Incorrect. Mid-market targeting can be a legitimate niche — stuck in the middle is about strategic clarity."}, {"text": "Companies with medium-sized marketing budgets cannot compete with large or small players", "explanation": "Incorrect. Budget size is not the issue — strategic clarity is."}], "correct": 0}, {"type": "standard", "question": "How must marketing objectives relate to corporate objectives?", "scenario": null, "options": [{"text": "Corporate objectives are set after marketing objectives to ensure market realism", "explanation": "Incorrect. Corporate objectives set the direction; marketing objectives flow from them."}, {"text": "They are the same thing described at different levels", "explanation": "Incorrect. Corporate objectives concern profitability and shareholder value; marketing objectives concern products and markets."}, {"text": "They are independent — marketing objectives are set based on market conditions alone", "explanation": "Incorrect. Marketing objectives must flow from corporate objectives — independence creates strategic misalignment."}, {"text": "Marketing objectives must be a logical consequence of corporate objectives — if achieved, they must result in corporate objectives being met", "explanation": "Correct. The test: if we achieve these marketing objectives, will our corporate profitability objectives be met? If not, there is misalignment."}], "correct": 3}, {"type": "scenario", "question": "A UK meal kit company has 28% UK market share and is considering: increasing UK penetration, launching in Germany and France, or adding grocery delivery for existing customers. Which Ansoff option should they prioritise first?", "scenario": "The company has strong brand loyalty and operational excellence in the UK. Their customer acquisition cost has been rising as the UK market matures. They have limited capital for major investment.", "options": [{"text": "Add grocery delivery immediately — diversification is the fastest growth path", "explanation": "Incorrect. Adding grocery is actually Product Development, not Diversification. The framework suggests lower-risk options before higher-risk ones."}, {"text": "Launch in Germany and France — international expansion is always the highest growth opportunity", "explanation": "Incorrect. International expansion carries significant risk and requires substantial capital. With rising UK acquisition costs but strong loyalty, internal growth options should come first."}, {"text": "Pursue all three simultaneously to maximise growth speed", "explanation": "Incorrect. Pursuing all simultaneously stretches resources and management attention — Ansoff is partly about resource allocation discipline."}, {"text": "Increase UK market penetration first — lowest risk, builds on existing strength — then add grocery delivery for existing loyal customers", "explanation": "Correct. Ansoff's risk hierarchy suggests exhausting penetration opportunities before diversifying. Adding grocery logically extends existing customer relationships before international complexity is added."}], "correct": 3}, {"type": "scenario", "question": "A premium skincare brand has 22% operating margins through differentiation on natural ingredients. The CEO launches a discount line at half price through discount retailers to hit a revenue growth target. What strategic danger is illustrated?", "scenario": "The brand has spent 10 years building premium positioning. The discount line uses the same brand name. The first month shows volume increases but also a 15% decline in premium line enquiries.", "options": [{"text": "The brand should further increase premium range prices to offset cannibalisation", "explanation": "Incorrect. Price increases on the premium range will not compensate for brand equity damage."}, {"text": "The brand will succeed because it is now accessible to more customers", "explanation": "Incorrect. Accessibility may increase volume but destroys the differentiation driving 22% margins."}, {"text": "This illustrates the stuck in the middle danger — attempting Cost Leadership AND Differentiation simultaneously risks destroying premium brand equity", "explanation": "Correct. Premium brands extending into discount destroy their differentiating proposition. Customers paying premiums reassess when the brand appears alongside budget products."}, {"text": "The gap analysis showed revenue growth was needed so any strategy is justified", "explanation": "Incorrect. Gap analysis shows how much growth is needed — it does not validate any strategy regardless of brand implications."}], "correct": 2}, {"type": "standard", "question": "What are digital contribution objectives?", "scenario": null, "options": [{"text": "The social media team's follower growth targets", "explanation": "Incorrect. Follower growth is a vanity metric — digital contribution objectives focus on business impact."}, {"text": "The percentage of marketing budget allocated to digital channels", "explanation": "Incorrect. Budget allocation is an input decision; digital contribution objectives measure output and impact."}, {"text": "Specific measurable targets for digital channels' role in achieving marketing objectives — percentage revenue online, lead generation rates, conversion rates", "explanation": "Correct. Digital contribution objectives integrate digital channel performance into the overall marketing objectives framework — making digital accountable to business outcomes."}, {"text": "The IT department's annual investment budget", "explanation": "Incorrect. Digital contribution objectives are marketing-focused, not IT investment metrics."}], "correct": 2}, {"type": "scenario", "question": "A B2B tech company sets the annual marketing objective as increasing brand awareness and improving perception of innovation leadership. At year-end awareness is up but revenue is flat. What went wrong?", "scenario": "The marketing team ran campaigns, created content, attended conferences, and won a marketing award. The CEO is frustrated that revenue did not move despite the awareness increase.", "options": [{"text": "The objectives were not SMART — they lacked specific product and market targets, quantified measures, and direct connection to revenue or market share outcomes", "explanation": "Correct. Increase awareness and improve perception are communications objectives masquerading as marketing objectives. SMART marketing objectives require specific product, market, share, and revenue targets."}, {"text": "The budget was too small to make an impact", "explanation": "Incorrect. Budget adequacy is separate from objective quality — the core error is the objective framework itself."}, {"text": "B2B marketing should not aim for brand awareness", "explanation": "Incorrect. Brand awareness is a valid communications objective — it is just not sufficient as a marketing objective on its own."}, {"text": "The campaigns were not creative enough", "explanation": "Incorrect. Creativity is not the issue — the fundamental problem is the objective itself."}], "correct": 0}, {"type": "standard", "question": "What is Market Penetration in the Ansoff Matrix and why is it lowest risk?", "scenario": null, "options": [{"text": "Selling more of existing products to existing markets — lowest risk because the company already knows both the product and the customers", "explanation": "Correct. Penetration leverages existing knowledge — no new unknowns to manage, making it the lowest-risk growth path."}, {"text": "Gaining market share through advertising", "explanation": "Incorrect. Advertising is a tactic within a penetration strategy — not the definition of penetration itself."}, {"text": "Reducing prices to attract new customers in existing markets", "explanation": "Incorrect. Price reduction is one possible tactic — not the full definition of market penetration."}, {"text": "Entering a new market aggressively with price reductions", "explanation": "Incorrect. Price penetration is a pricing tactic; Ansoff's Market Penetration is a strategic quadrant."}], "correct": 0}], "7": [{"type": "standard", "question": "What are communications objectives primarily about?", "scenario": null, "options": [{"text": "Generating leads and driving sales directly", "explanation": "Incorrect. Lead generation and sales are marketing objectives — communications objectives are about mental state changes."}, {"text": "Maximising reach and frequency at minimum cost", "explanation": "Incorrect. Reach and frequency are media planning metrics — inputs to communications, not the objectives themselves."}, {"text": "Creating awareness and changing attitudes in target audiences", "explanation": "Correct. The book states communications objectives are primarily about two things: creating awareness and changing an attitude."}, {"text": "Increasing social media engagement and followers", "explanation": "Incorrect. Social metrics are tactical performance indicators, not communications objectives."}], "correct": 2}, {"type": "standard", "question": "What is Integrated Marketing Communications?", "scenario": null, "options": [{"text": "Integrating the marketing and sales departments into one team", "explanation": "Incorrect. Organisational integration is related but distinct — IMC is specifically about communications consistency."}, {"text": "Using the same advertising agency for all campaigns", "explanation": "Incorrect. IMC is about message consistency and coordination, not agency consolidation."}, {"text": "Using digital and traditional media in the same campaign", "explanation": "Incorrect. Mixed media is a channel mix decision — IMC is about the CONSISTENCY of the message across those channels."}, {"text": "Coordinating all communications channels to deliver a consistent brand message and experience", "explanation": "Correct. IMC ensures all channels — advertising, PR, digital, social, sales materials, service — deliver the same brand promise consistently."}], "correct": 3}, {"type": "standard", "question": "What is the RACE digital marketing framework?", "scenario": null, "options": [{"text": "Reach, Advertise, Convert, Evaluate", "explanation": "Incorrect. This misnames two RACE stages."}, {"text": "Research, Analyse, Create, acy — each requiring different communications approaches, messages, and media", "explanation": "Correct. Awareness then Consideration then Preference then Purchase then Loyalty then Advocacy. Different communications are required at each stage."}, {"text": "The sequence of touchpoints in a digital sales funnel only", "explanation": "Incorrect. The digital funnel is one component — the decision journey is broader and includes offline stages and post-purchase."}], "correct": 2}, {"type": "standard", "question": "What distinguishes always-on digital marketing from campaign marketing?", "scenario": null, "options": [{"text": "Always-on is for existing customers; campaigns are for acquisition", "explanation": "Incorrect. Both can serve acquisition and retention."}, {"text": "Campaign marketing has higher ROI than always-on activity", "explanation": "Incorrect. The book does not make this claim — both serve different functions and both contribute to overall effectiveness."}, {"text": "Always-on is automated; campaign marketing requires human management", "explanation": "Incorrect. Both can be automated — the distinction is about continuity versus time-bounded bursts."}, {"text": "Always-on is continuous activity running year-round; campaigns are time-bounded bursts for specific objectives or events", "explanation": "Correct. Always-on as the foundation plus campaigns layered on top for peaks, launches, or seasonal events is the recommended approach."}], "correct": 3}, {"type": "standard", "question": "What is greenwashing and why is it dangerous?", "scenario": null, "options": [{"text": "Targeting environmentally-conscious consumers with premium products", "explanation": "Incorrect. Targeting eco-conscious segments is legitimate marketing — greenwashing is specifically about deception."}, {"text": "Overinvesting in genuine sustainability at the expense of profitability", "explanation": "Incorrect. Over-investment in genuine sustainability is not greenwashing — greenwashing specifically involves deception."}, {"text": "Using green colours in brand design", "explanation": "Incorrect. Greenwashing refers to deceptive environmental claims, not colour choices."}, {"text": "Making misleading or unsubstantiated environmental claims in marketing communications", "explanation": "Correct. Greenwashing is illegal in many markets and destroys brand trust when exposed."}], "correct": 3}, {"type": "standard", "question": "What are the 6 elements of a properly prepared advertising plan?", "scenario": null, "options": [{"text": "Communications objectives, Target audience, Key message strategy, Media selection, Budget, Evaluation method", "explanation": "Correct. The book specifies all 6 must be present in a properly prepared advertising plan."}, {"text": "TV, Radio, Digital, Print, Outdoor, Events", "explanation": "Incorrect. This is a list of media channels — just one element of the advertising plan."}, {"text": "Reach, Frequency, Cost, Creative, Timeline, Agency", "explanation": "Incorrect. These are media planning and execution elements, not the 6 advertising plan elements."}, {"text": "Brand promise, Visual identity, Tagline, Media mix, Timing, Results", "explanation": "Incorrect. These are components but do not match the book's specified 6 elements."}], "correct": 0}, {"type": "scenario", "question": "A UK bank runs an award-winning campaign saying we are here for you always. Customers wait 35 minutes on hold, branches closed 40% in 3 years, the app crashes weekly. What IMC failure is this?", "scenario": "The campaign wins the Marketing Week Grand Prix award. Social media fills with customer complaints about service levels. The brand's NPS dropped 18 points since the campaign launched.", "options": [{"text": "The bank demonstrates the pattern the book calls award-winning advertising that cannot compensate for a broken value proposition and service delivery failures", "explanation": "Correct. The book cites British Airways winning awards while failing to deliver on their promises. IMC requires ALL channels including service delivery to reflect the brand promise."}, {"text": "The bank needs a better creative agency for its next campaign", "explanation": "Incorrect. Creative quality is not the issue — the promise-delivery gap is."}, {"text": "TV advertising is ineffective for financial services", "explanation": "Incorrect. Media channel effectiveness is not the issue here."}, {"text": "The bank should shift to digital-only communications", "explanation": "Incorrect. Channel shift does not solve the fundamental misalignment between brand promise and customer experience."}], "correct": 0}, {"type": "scenario", "question": "A B2B logistics company has 85% brand awareness but only 12% shortlist inclusion versus a 38% competitor average. How should communications objectives be set?", "scenario": "The marketing director argues for more advertising to push awareness to 95%. The sales director says customers know who we are but do not trust us to deliver. Customer interviews confirm reliability concerns.", "options": [{"text": "Set a communications objective to change attitudes — specifically improving perception of reliability and service quality to close the shortlist inclusion gap", "explanation": "Correct. This is an ATTITUDE problem, not an AWARENESS problem. The book distinguishes these explicitly — they require completely different communications strategies."}, {"text": "Increase advertising frequency to stay top of mind", "explanation": "Incorrect. More frequency of the same message will not change attitudes if the underlying perception issue is not addressed."}, {"text": "Set a sales objective to improve close rates on proposals received", "explanation": "Incorrect. They are not getting on shortlists — close rate improvement is irrelevant if they never reach the proposal stage."}, {"text": "Set a communications objective to increase brand awareness to 95%", "explanation": "Incorrect. Awareness is already high at 85% — more awareness will not fix a perception and trust problem."}], "correct": 0}, {"type": "standard", "question": "What is the pull versus push distinction in the communications mix?", "scenario": null, "options": [{"text": "Pull equals long-term brand building; Push equals short-term sales activation", "explanation": "Incorrect. Both can be short or long term — the distinction is direction of communication flow through the channel."}, {"text": "Pull equals inbound digital marketing; Push equals outbound traditional advertising", "explanation": "Incorrect. While related to inbound and outbound concepts, pull and push in this context refers to channel flow direction."}, {"text": "Pull equals premium pricing strategy; Push equals penetration pricing", "explanation": "Incorrect. Pull and push relate to communications and channel strategy, not pricing."}, {"text": "Pull means marketing directly to end consumers to create demand that pulls product through the channel; Push means marketing to intermediaries to push product through distribution", "explanation": "Correct. Pull invests in consumer advertising and brand building. Push invests in trade promotions, sales force incentives, and distributor support."}], "correct": 3}], "8": [{"type": "standard", "question": "At what stage of purchase do most B2B buyers engage a salesperson today?", "scenario": null, "options": [{"text": "After receiving proposals from multiple suppliers", "explanation": "Incorrect. Engagement typically happens before formal proposals but well into the buyer's evaluation."}, {"text": "At the very beginning — they call a supplier first when a need arises", "explanation": "Incorrect. Digital research has moved this dramatically. Buyers research extensively before contacting suppliers."}, {"text": "Only at the final negotiation stage", "explanation": "Incorrect. This would represent 90% or more through the journey — the average is 57 to 70 percent."}, {"text": "57 to 70 percent through their purchase decision — after extensive online research and evaluation", "explanation": "Correct. Digital content has shifted the buyer journey significantly — salespeople now enter conversations well into the evaluation process."}], "correct": 3}, {"type": "standard", "question": "When is personal selling most important?", "scenario": null, "options": [{"text": "When advertising budgets are insufficient", "explanation": "Incorrect. Personal selling is not a fallback for advertising — it serves distinct strategic purposes."}, {"text": "For all products, in all markets, at all times", "explanation": "Incorrect. Personal selling is most important in specific contexts — not universally the most effective approach."}, {"text": "Only for luxury consumer products where emotional purchase drivers dominate", "explanation": "Incorrect. The book's criteria apply primarily to B2B contexts of complexity and risk."}, {"text": "When products are complex or customised, buyer risk is high, relationships matter, or post-sale implementation support is needed", "explanation": "Correct. Personal selling adds most value where digital and self-service cannot adequately address complexity, risk, relationships, or support needs."}], "correct": 3}, {"type": "standard", "question": "What is Key Account Management?", "scenario": null, "options": [{"text": "The process of negotiating annual contracts with large customers", "explanation": "Incorrect. Annual contract negotiation is a transaction; KAM is an ongoing strategic relationship management approach."}, {"text": "A CRM system for tracking large accounts", "explanation": "Incorrect. CRM technology may support KAM but is not KAM itself — KAM is a relationship management philosophy."}, {"text": "A strategic approach to managing strategically important customers through dedicated resources, cross-functional teams, and executive relationships", "explanation": "Correct. KAM involves dedicated account managers, executive sponsorship, cross-functional teams, and written strategic account plans."}, {"text": "Giving the largest customers bigger discounts to maintain loyalty", "explanation": "Incorrect. KAM is a strategic relationship approach — not simply a pricing strategy."}], "correct": 2}, {"type": "standard", "question": "What are the five stages of KAM relationship development?", "scenario": null, "options": [{"text": "RFP then Shortlist then Proposal then Negotiation then Contract", "explanation": "Incorrect. This is a sales process sequence, not KAM relationship stages."}, {"text": "Transactional then Basic KAM then Cooperative KAM then Interdependent KAM then Integrated KAM", "explanation": "Correct. Each stage represents increasing depth of integration, trust, and mutual dependency between buyer and supplier organisations."}, {"text": "Prospect then Lead then Customer then Loyal then Ambassador", "explanation": "Incorrect. This is a customer lifecycle model, not KAM development stages."}, {"text": "Awareness then Trial then Adoption then Retention then Advocacy", "explanation": "Incorrect. This is a consumer adoption funnel, not KAM relationship development stages."}], "correct": 1}, {"type": "standard", "question": "What is Account-Based Marketing?", "scenario": null, "options": [{"text": "Marketing to large groups of customers with similar account characteristics", "explanation": "Incorrect. ABM treats individual accounts as markets of one — the opposite of group-based marketing."}, {"text": "A digital advertising approach targeting lookalike audiences of existing customers", "explanation": "Incorrect. Lookalike targeting is programmatic advertising — not full ABM."}, {"text": "Setting account-level revenue targets for the sales team", "explanation": "Incorrect. Revenue targets are sales planning — not the definition of ABM."}, {"text": "A B2B strategy concentrating marketing and sales resources on specific high-value target accounts, treating each as a market of one with personalised campaigns", "explanation": "Correct. ABM aligns marketing and sales on the same target accounts with personalised content, events, and outreach tailored to each account's specific context."}], "correct": 3}, {"type": "standard", "question": "What is the right approach to sales force performance management?", "scenario": null, "options": [{"text": "Only activity metrics — calls made, proposals sent, visits completed", "explanation": "Incorrect. Activity metrics alone encourage busyness, not business — outcomes must also be measured."}, {"text": "Customer satisfaction scores are the only metric that matters", "explanation": "Incorrect. CSAT is important but insufficient — it must be combined with financial and activity metrics."}, {"text": "Both activity metrics and outcome metrics must be tracked together — calls and proposals alongside revenue, margin, new customers, and churn rate", "explanation": "Correct. Activity without results equals wasted effort. Results without activity insight equals inability to coach and improve performance."}, {"text": "Only outcome metrics — revenue generated and deals closed", "explanation": "Incorrect. Without activity insight, it is impossible to diagnose why outcomes are poor or identify coaching opportunities."}], "correct": 2}, {"type": "standard", "question": "What are the three types of ABM programmes by scale?", "scenario": null, "options": [{"text": "Inbound, Outbound, Event-based", "explanation": "Incorrect. These are demand generation approaches — not ABM programme types."}, {"text": "Traditional, Digital, Hybrid", "explanation": "Incorrect. These are channel types, not ABM programme types."}, {"text": "Strategic ABM for one-to-one top accounts, ABM Lite for one-to-few next tier, Programmatic ABM for one-to-many using technology", "explanation": "Correct. Different investment levels: bespoke for most valuable accounts, cluster-based for next tier, technology-driven personalisation for broader target list."}, {"text": "Enterprise, Mid-market, SMB", "explanation": "Incorrect. These are market segments, not ABM programme types."}], "correct": 2}, {"type": "scenario", "question": "A software company has 150 customers. 12 generate 65% of revenue but are served on first-come-first-served basis like all other customers. Three of the 12 did not renew this year. What failure is illustrated?", "scenario": "When these 12 critical accounts call with problems they wait in the same queue as all other customers. Their account managers also each manage 40 to 50 other accounts simultaneously.", "options": [{"text": "The company needs a better CRM system to track these accounts", "explanation": "Incorrect. Technology does not solve the relationship management deficit — dedicated human resources and strategic attention are needed."}, {"text": "The renewals issue is a pricing problem — key accounts need better commercial terms", "explanation": "Incorrect. Price may be a factor, but the root cause is inadequate relationship management."}, {"text": "No KAM structure exists — the most strategically important accounts are treated like ordinary accounts, causing relationship deterioration and churn", "explanation": "Correct. KAM requires dedicated resources, priority service, and proactive relationship management. Treating key accounts identically to ordinary accounts is the strategic failure."}, {"text": "The company needs to hire more salespeople", "explanation": "Incorrect. Headcount is not the primary issue — the 12 critical accounts are not being managed strategically."}], "correct": 2}, {"type": "scenario", "question": "A manufacturing company has 8 salespeople each responsible for all products from simple consumables to complex custom engineering solutions across geographic territories. Customers report salespeople cannot answer technical questions about complex solutions. What design principle is violated?", "scenario": "Win rates on complex engineering solutions are 12%. Win rates on consumables are 67%. Both are
